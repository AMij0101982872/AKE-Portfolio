# Local
#   docker compose up dev           → http://localhost:3000  (hot-reload)
#   docker compose up --build prod  → http://localhost:8080  (exactement l'image de production)

services:
  dev:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules # garde les node_modules de l'image (Linux)
      - /app/.next
    environment:
      - NEXT_PUBLIC_BASE_PATH=

  prod:
    build:
      context: .
      target: runtime
      args:
        NEXT_PUBLIC_BASE_PATH: ""
    image: portfolio:local
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101
      - /var/cache/nginx:uid=101,gid=101
    restart: unless-stopped
