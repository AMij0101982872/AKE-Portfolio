name: CI

# Sur chaque Pull Request et chaque push hors de main :
# même Dockerfile qu'en local → lint + typecheck + build + smoke test de l'image Nginx.
on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint · Types · Build · Smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Étape "build" du Dockerfile : échoue si lint, types ou build échouent
      - name: Build (lint + typecheck + next build)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: build
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Image runtime chargée localement puis testée en vrai
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: portfolio:ci
          cache-from: type=gha

      - name: Smoke test
        run: |
          docker run -d --name site -p 8080:8080 portfolio:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/fr/ | grep -q '<html lang="fr"'
          curl -fsS http://localhost:8080/en/ | grep -q '<html lang="en"'
          echo "✅ /fr/ et /en/ servis par Nginx"
          docker rm -f site
